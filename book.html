<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Where Butterflies Belong</title>

<style>
body{
    margin:0;
    background:#000;
    text-align:center;
    font-family:Arial,sans-serif;
}

img{
    width:100%;
    max-width:900px;
    height:auto;
    display:block;
    margin:auto;
}

.buttons{
    display:flex;
    justify-content:space-between;
    align-items:center;
    max-width:900px;
    margin:20px auto;
    padding:0 15px 25px;
}

button{
    background:#111;
    color:white;
    border:none;
    padding:14px 30px;
    border-radius:12px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#333;
}

button:disabled{
    background:#666;
    cursor:not-allowed;
    opacity:0.7;
}
</style>

</head>

<body>

<img src="Beige Aesthetic Motivational Instagram Post _20260903_094809_0000.png" alt="Page 1">

<div class="buttons">
<button disabled>← Previous</button>

<button>Next →</button>
</div>

</body>
</html>
